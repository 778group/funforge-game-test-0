<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tap to Win</title><style>body{margin:0;background:linear-gradient(135deg,#ff6bcb,#4ecdc4);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#fff;text-align:center}main{padding:2rem;border-radius:2rem;background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);box-shadow:0 8px 32px rgba(0,0,0,0.25)}h1{font-size:3rem;margin:0 0 0.5rem;text-shadow:0 2px 10px rgba(0,0,0,0.3)}#ready{font-size:1.2rem;margin:0 0 1.5rem;opacity:0.9}button{font-size:1.25rem;padding:1rem 2rem;border:none;border-radius:50px;background:#fff;color:#333;font-weight:700;box-shadow:0 4px 15px rgba(0,0,0,0.2);cursor:pointer;transition:transform .1s ease,box-shadow .2s ease;margin:0.5rem}button:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,0.3)}button:active{transform:translateY(1px)}#win{font-size:2.5rem;font-weight:800;margin:1rem 0;color:#fffacd;text-shadow:0 2px 12px rgba(0,0,0,0.4);animation:bounce .6s ease}@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-15px)}60%{transform:translateY(5px)}}</style></head><body><main><h1>Tap to Win</h1><p id="ready">Ready to play</p><button id="start">Start</button><button id="finish" hidden>Finish</button><p id="win" hidden>You win!</p><button id="restart" hidden>Restart</button></main><script type="application/json" id="funforge-test-manifest">{"version":1,"readySelector":"#ready","playableSelector":"#start","resultSelector":"#win","restartSelector":"#restart","initialSelector":"#start","actions":[{"type":"click","selector":"#start"},{"type":"click","selector":"#finish"}]}</script><script>const s=document.querySelector('#start'),f=document.querySelector('#finish'),w=document.querySelector('#win'),r=document.querySelector('#restart');s.onclick=()=>{s.hidden=true;f.hidden=false};f.onclick=()=>{f.hidden=true;w.hidden=false;r.hidden=false};r.onclick=()=>{r.hidden=true;w.hidden=true;s.hidden=false};</script></body></html>
